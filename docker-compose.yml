services:
  db:
    image: postgres:16-alpine
    container_name: pran_rfl_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pran_rfl
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: pran_rfl_backend
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8000:8000"
    volumes:
      # Mount application code for live updates (dev mode)
      - ./app:/app/app
      - ./testui.html:/app/testui.html
      # itemsdb.csv — mounting allows you to update the CSV without rebuilding
      - ./itemsdb.csv:/app/itemsdb.csv
      # Mount .env so changes are reflected without container rebuild
      - ./.env:/app/.env
      # Persist uploaded images across restarts
      - ./media:/app/media
      # Persist embeddings across restarts so they are not regenerated on every start.
      # On first run (or after 'docker compose build'), the image-baked embeddings
      # are used.  To force a rebuild:
      #   docker exec pran_rfl_backend python scripts/build_embeddings.py
      - embeddings_data:/app/embeddings
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/pran_rfl
      STORAGE_BASE_URL: /
      # High-definition vision preserves fine packaging text, price tags, and shelf talkers
      MAX_IMAGE_DIMENSION: "1600"
      OPENROUTER_MODEL: "google/gemini-3.7-flash"
      OPENROUTER_REASONING_EFFORT: "low"
      OPENROUTER_REASONING_MAX_TOKENS: "1024"
      OPENROUTER_MAX_TOKENS: "6000"
      GEMINI_THINKING_BUDGET: "1024"
      # Semantic search tuning (hybrid dense + BM25 + Cross-Encoder reranker)
      ENABLE_RERANKER: "true"
      EMBEDDING_MODEL: "all-MiniLM-L6-v2"
      CATALOGUE_SIMILARITY_THRESHOLD: "0.30"
      EMBEDDINGS_DIR: "/app/embeddings"
      # Prevent HuggingFace from making unauthenticated HTTP checks at runtime
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  embeddings_data:
