version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: pran_rfl_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pran_rfl
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: pran_rfl_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Mount application code and test UI for live updates
      - ./app:/app/app
      - ./testui.html:/app/testui.html
      # Persist uploaded images across restarts
      - ./media:/app/media
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file:
      - .env
    environment:
      # Override DATABASE_URL to point to the Postgres service above
      DATABASE_URL: postgresql://postgres:postgres@db:5432/pran_rfl
      STORAGE_BASE_URL: http://localhost:8000
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
