<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRAN-RFL MerchVision Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --accent: #f97316;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --warning: #eab308;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top right, #1e1b4b, #0f172a 60%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 24px;
    }
    h1 { font-size: 24px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 10px; }
    .badge {
      background: linear-gradient(135deg, #f97316, #ea580c);
      font-size: 11px;
      text-transform: uppercase;
      padding: 4px 8px;
      border-radius: 9999px;
      font-weight: 700;
    }
    .links a {
      color: var(--primary);
      text-decoration: none;
      font-size: 14px;
      margin-left: 16px;
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    @media (max-width: 840px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
    }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: rgba(56, 189, 248, 0.15);
      color: var(--primary);
    }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
    input[type="text"], input[type="url"], input[type="file"] {
      width: 100%;
      padding: 10px 12px;
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
    }
    input:focus { outline: none; border-color: var(--primary); }
    button.submit-btn {
      width: 100%;
      background: var(--primary);
      color: #0f172a;
      font-weight: 700;
      padding: 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }
    button.submit-btn:hover { background: var(--primary-hover); }
    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .status-PENDING { background: rgba(234, 179, 8, 0.2); color: var(--warning); }
    .status-PROCESSING { background: rgba(56, 189, 248, 0.2); color: var(--primary); }
    .status-COMPLETED { background: rgba(34, 197, 94, 0.2); color: var(--success); }
    .status-FAILED { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
    .product-list { list-style: none; margin-top: 12px; }
    .product-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 12px;
      background: #0f172a;
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 13px;
    }
    .product-qty { font-weight: 700; color: var(--primary); }
    .image-preview {
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      border-radius: 8px;
      margin-top: 12px;
      border: 1px solid var(--border-color);
    }
    .history-card { margin-top: 24px; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid var(--border-color); }
    th { color: var(--text-muted); font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>PRAN-RFL MerchVision <span class="badge">AI Vision</span></h1>
      <div class="links">
        <a href="/docs" target="_blank">Swagger API</a>
        <a href="/redoc" target="_blank">ReDoc</a>
      </div>
    </header>

    <div class="grid">
      <!-- Upload Panel -->
      <div class="card">
        <div class="tabs">
          <button class="tab-btn active" id="tabUrl" onclick="setMode('url')">Analyze via Image URL</button>
          <button class="tab-btn" id="tabFile" onclick="setMode('file')">Upload Image File</button>
        </div>

        <!-- Mode URL -->
        <form id="urlForm" onsubmit="submitUrl(event)">
          <div class="form-group">
            <label for="imgUrl">Rack Image URL (HTTP/HTTPS)</label>
            <input type="url" id="imgUrl" placeholder="https://example.com/rack.jpg" required>
          </div>
          <div class="form-group">
            <label for="shopIdUrl">Shop ID (Optional)</label>
            <input type="text" id="shopIdUrl" placeholder="SHOP-Gulshan-102">
          </div>
          <div class="form-group">
            <label for="merchIdUrl">Merchandiser ID (Optional)</label>
            <input type="text" id="merchIdUrl" placeholder="MER-Rahim-45">
          </div>
          <button type="submit" class="submit-btn" id="btnSubmitUrl">Start AI Analysis (URL)</button>
        </form>

        <!-- Mode File -->
        <form id="fileForm" style="display:none;" onsubmit="submitFile(event)">
          <div class="form-group">
            <label for="imgFile">Rack Photo File (JPG, PNG, WebP)</label>
            <input type="file" id="imgFile" accept="image/jpeg,image/png,image/webp" required>
          </div>
          <div class="form-group">
            <label for="shopIdFile">Shop ID (Optional)</label>
            <input type="text" id="shopIdFile" placeholder="SHOP-Gulshan-102">
          </div>
          <div class="form-group">
            <label for="merchIdFile">Merchandiser ID (Optional)</label>
            <input type="text" id="merchIdFile" placeholder="MER-Rahim-45">
          </div>
          <button type="submit" class="submit-btn" id="btnSubmitFile">Upload & Analyze File</button>
        </form>
      </div>

      <!-- Live Result Panel -->
      <div class="card" id="resultCard">
        <h2 style="font-size: 16px; margin-bottom: 12px; color: var(--text-muted);">Current Analysis Result</h2>
        <div id="resultContent" style="color: var(--text-muted); font-size: 14px;">
          Submit an image URL or file to see live AI detection results here.
        </div>
      </div>
    </div>

    <!-- History Panel -->
    <div class="card history-card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 style="font-size: 16px; color: var(--text-muted);">Recent Scan History</h2>
        <button onclick="loadHistory()" style="background:transparent; border:1px solid var(--border-color); color:var(--text-muted); padding:4px 8px; border-radius:4px; cursor:pointer;">Refresh</button>
      </div>
      <div id="historyTableContainer">Loading history...</div>
    </div>
  </div>

  <script>
    let pollInterval = null;

    function setMode(mode) {
      document.getElementById('tabUrl').classList.toggle('active', mode === 'url');
      document.getElementById('tabFile').classList.toggle('active', mode === 'file');
      document.getElementById('urlForm').style.display = mode === 'url' ? 'block' : 'none';
      document.getElementById('fileForm').style.display = mode === 'file' ? 'block' : 'none';
    }

    async function submitUrl(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmitUrl');
      btn.disabled = true;
      btn.innerText = 'Submitting URL...';

      const payload = {
        image_url: document.getElementById('imgUrl').value.trim(),
        shop_id: document.getElementById('shopIdUrl').value.trim() || null,
        merchandiser_id: document.getElementById('merchIdUrl').value.trim() || null
      };

      try {
        const res = await fetch('/uploads/url', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Upload failed');
        startPolling(data.upload_id);
      } catch (err) {
        alert('Error: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = 'Start AI Analysis (URL)';
      }
    }

    async function submitFile(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmitFile');
      btn.disabled = true;
      btn.innerText = 'Uploading File...';

      const formData = new FormData();
      formData.append('file', document.getElementById('imgFile').files[0]);
      const shop = document.getElementById('shopIdFile').value.trim();
      if (shop) formData.append('shop_id', shop);
      const merch = document.getElementById('merchIdFile').value.trim();
      if (merch) formData.append('merchandiser_id', merch);

      try {
        const res = await fetch('/uploads', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Upload failed');
        startPolling(data.upload_id);
      } catch (err) {
        alert('Error: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = 'Upload & Analyze File';
      }
    }

    function startPolling(uploadId) {
      if (pollInterval) clearInterval(pollInterval);
      pollResult(uploadId);
      pollInterval = setInterval(() => pollResult(uploadId), 2000);
    }

    async function pollResult(uploadId) {
      try {
        const res = await fetch(`/uploads/${uploadId}`);
        const data = await res.json();
        renderResult(data);
        if (data.status === 'COMPLETED' || data.status === 'FAILED') {
          clearInterval(pollInterval);
          loadHistory();
        }
      } catch (err) {
        console.error(err);
      }
    }

    function renderResult(data) {
      const container = document.getElementById('resultContent');
      let productsHtml = '';
      if (data.detected_products && data.detected_products.length > 0) {
        productsHtml = '<ul class="product-list">' + data.detected_products.map(p => `
          <li class="product-item">
            <span>${p.product_name}</span>
            <span class="product-qty">Qty: ${p.quantity_visible ?? 'N/A'}</span>
          </li>
        `).join('') + '</ul>';
      } else if (data.status === 'COMPLETED') {
        productsHtml = '<p style="color:var(--text-muted); margin-top:8px;">No PRAN-RFL products identified in this scan.</p>';
      }

      container.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <strong>Upload ID:</strong> <span style="font-family:monospace; font-size:12px;">${data.upload_id}</span>
          <span class="status-badge status-${data.status}">${data.status}</span>
        </div>
        <div><strong>Shop:</strong> ${data.shop_id || 'Unassigned'} | <strong>Merchandiser:</strong> ${data.merchandiser_id || 'Unassigned'}</div>
        ${data.error_message ? `<div style="color:var(--danger); margin-top:8px;">Error: ${data.error_message}</div>` : ''}
        ${productsHtml}
        ${data.image_url ? `<img src="${data.image_url}" class="image-preview" alt="Rack Preview">` : ''}
      `;
    }

    async function loadHistory() {
      const container = document.getElementById('historyTableContainer');
      try {
        const res = await fetch('/uploads?limit=10');
        const data = await res.json();
        if (!data.items || data.items.length === 0) {
          container.innerHTML = '<p style="color:var(--text-muted); font-size:13px; margin-top:8px;">No uploads recorded yet.</p>';
          return;
        }
        container.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>Time</th>
                <th>Shop ID</th>
                <th>Merchandiser</th>
                <th>Status</th>
                <th>Products Detected</th>
              </tr>
            </thead>
            <tbody>
              ${data.items.map(item => `
                <tr style="cursor:pointer;" onclick="startPolling('${item.upload_id}')">
                  <td>${new Date(item.created_at).toLocaleTimeString()}</td>
                  <td>${item.shop_id || '-'}</td>
                  <td>${item.merchandiser_id || '-'}</td>
                  <td><span class="status-badge status-${item.status}">${item.status}</span></td>
                  <td>${item.detected_products ? item.detected_products.length : 0} items</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      } catch (err) {
        container.innerHTML = '<p style="color:var(--danger);">Failed to load history.</p>';
      }
    }

    window.onload = () => loadHistory();
  </script>
</body>
</html>
